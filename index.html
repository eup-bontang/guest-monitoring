<!doctype html>
<html lang="id" data-tema="light" data-layout="tv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jadwal Kunjungan Tamu</title>
<style>
  /* TEMA TERANG = default */
  :root{
    --brand:#b73634; --brand-soft:#c0403d; --slate:#5b7a99;
    --bg:#e8ecf1; --panel:#ffffff; --row:#f3f5f8; --line:#d9e0e8;
    --text:#1c2733; --muted:#5d6b7c; --green:#12934a; --amber:#b26b00;
    --bar:#f7f9fb; --chip:#eef1f5; --footer:#dde3ea;
    --inst-bg:rgba(192,64,61,.08); --badge-t:rgba(18,147,74,.10); --badge-i:rgba(178,107,0,.11);
    --shadow:0 .2rem 1.2rem rgba(28,39,51,.10);
  }
  /* TEMA GELAP */
  :root[data-tema="dark"]{
    --brand:#c0403d; --brand-soft:#e0716e; --slate:#8fa5be;
    --bg:#0e1620; --panel:#16212e; --row:#1b2838; --line:#26364a;
    --text:#f3f6fa; --muted:#93a4b8; --green:#2fdc62; --amber:#f2b84b;
    --bar:#101b27; --chip:#0f1822; --footer:#0b121a;
    --inst-bg:rgba(224,113,110,.11); --badge-t:rgba(47,220,98,.08); --badge-i:rgba(242,184,75,.10);
    --shadow:none;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  /* 1rem = 10px pada 1920x1080; seluruh layout ikut skala layar TV */
  html{font-size:min(.520833vw,.925926vh)}
  body{width:100vw;height:100vh;overflow:hidden;background:var(--bg);color:var(--text);
       font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;display:flex;flex-direction:column}

  header{background:#fff;height:15rem;display:flex;align-items:center;justify-content:space-between;padding:0 5rem}
  .title h1{font-size:5.2rem;font-weight:800;letter-spacing:.4rem;color:#1c2733;line-height:1}
  .title p{font-size:2.1rem;color:#6b6461;letter-spacing:.3rem;margin-top:1.2rem;text-transform:uppercase}
  .logo{height:11.5rem;display:block}
  .stripe{height:.9rem;background:linear-gradient(90deg,var(--brand) 0 60%,#6b6461 60% 100%)}

  .bar{display:flex;justify-content:space-between;align-items:center;padding:0 5rem;height:9rem;background:var(--bar);border-bottom:1px solid var(--line)}
  .date{font-size:3.4rem;font-weight:600}
  .clock{font-size:6rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.2rem}
  .clock small{font-size:2.6rem;color:var(--muted);font-weight:500;margin-left:.6rem}

  main{flex:1;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1fr);gap:2.4rem;padding:2.6rem 5rem 2rem;min-height:0}
  .panel{box-shadow:var(--shadow);background:var(--panel);border:1px solid var(--line);border-radius:1.6rem;display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .ph{display:flex;align-items:center;justify-content:space-between;padding:0 2.6rem;height:8rem;border-bottom:1px solid var(--line);flex:none}
  .ph h2{font-size:3.4rem;font-weight:800;letter-spacing:.3rem;display:flex;align-items:center;gap:1.4rem}
  .ph h2::before{content:"";width:1rem;height:4rem;border-radius:.5rem;background:var(--brand-soft)}
  .next .ph{padding:0 1.8rem;flex-direction:column;align-items:flex-start;justify-content:center;height:10rem;gap:.9rem}
  .next .ph h2{font-size:2.7rem;letter-spacing:.2rem}
  .next .ph h2::before{background:var(--slate);height:3.2rem}
  .chips{display:flex;gap:1rem;align-items:center}
  .chip{font-size:2.1rem;color:var(--muted);background:var(--chip);border:1px solid var(--line);padding:.5rem 1.4rem;border-radius:5rem;white-space:nowrap}
  .chip b{color:var(--text);font-size:2.5rem;margin-right:.4rem}
  .next .chip{font-size:1.6rem;padding:.3rem 1rem}.next .chip b{font-size:1.9rem}

  .list{flex:1;padding:1.6rem 2rem;display:flex;flex-direction:column;gap:1.2rem;min-height:0;overflow:hidden}

  /* ===== HARI INI: baris lebar ===== */
  .row{display:grid;grid-template-columns:10rem minmax(0,.85fr) minmax(0,1.4fr) minmax(0,.8fr) minmax(0,1.3fr) 7rem 13.5rem;align-items:center;gap:1.4rem;
       background:var(--row);border-radius:1.2rem;padding:1rem 2.2rem;min-height:10.4rem;border-left:.7rem solid var(--brand-soft);flex:none}
  .fld .lb{display:block;font-size:1.4rem;color:var(--muted);font-weight:500;letter-spacing:.12rem;text-transform:uppercase;margin-bottom:.25rem}
  .fld .val{font-size:2.1rem;font-weight:600;line-height:1.2;display:block;overflow-wrap:anywhere}
  .fld.nm .val{font-size:2.5rem;font-weight:700;line-height:1.15}
  .fld.wide .val{font-size:2rem;line-height:1.2}
  /* INSTANSI: kolom tersendiri, diberi sorotan agar mudah dikenali */
  .fld.inst{background:var(--inst-bg);border-left:.4rem solid var(--brand-soft);border-radius:.9rem;padding:.55rem 1.2rem}
  .fld.inst .lb{color:var(--brand-soft);font-weight:700}
  .fld.inst .val{font-size:2.15rem;font-weight:700;color:var(--text);line-height:1.15}
  .jam .lb{display:block;font-size:1.45rem;color:var(--muted);font-weight:500;letter-spacing:.12rem;text-transform:uppercase;margin-bottom:.25rem}
  .jam{border-right:.2rem solid var(--line);padding-right:1rem;align-self:stretch;display:flex;flex-direction:column;justify-content:center}
  .jam .v{font-size:3.3rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
  .qty{font-size:3rem;font-weight:700;text-align:center;line-height:1.1}
  .qty small{display:block;font-size:1.45rem;color:var(--muted);font-weight:500;letter-spacing:.12rem;text-transform:uppercase}
  .badge{justify-self:end;font-size:1.85rem;font-weight:700;padding:.65rem 1.3rem;border-radius:5rem;white-space:nowrap;border:.2rem solid}
  .badge.t{color:var(--green);border-color:var(--green);background:var(--badge-t)}
  .badge.i{color:var(--amber);border-color:var(--amber);background:var(--badge-i)}

  /* ===== 7 HARI KE DEPAN: kartu ringkas ===== */
  .card{background:var(--row);border-radius:1.1rem;padding:.8rem 1.5rem;min-height:13rem;border-left:.6rem solid var(--slate);flex:none;display:flex;flex-direction:column;gap:.2rem;line-height:1.15}
  .card .l1{display:flex;justify-content:space-between;align-items:center;gap:1rem}
  .card .dt{font-size:1.95rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .card .dt .d{color:var(--slate)}.card .dt .j{color:var(--text);margin-right:.9rem}
  .card .badge{font-size:1.4rem;padding:.15rem .9rem;border-width:.15rem;flex:none}
  .card .nm2{font-size:2.05rem;font-weight:700;overflow-wrap:anywhere}
  .card .in2{font-size:1.85rem;font-weight:700;color:var(--brand-soft);overflow-wrap:anywhere}
  .card .l4,.card .l5{font-size:1.7rem;overflow-wrap:anywhere}
  .card .l4{color:var(--muted)}
  .card .l5 i,.card .l4 i{font-style:normal;color:var(--muted);margin-right:.5rem}
  .card .l5{color:var(--text)}

  .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:2.8rem;gap:1rem;text-align:center;padding:0 2rem}
  .next .empty{font-size:2rem}
  .empty i{font-style:normal;font-size:6rem;opacity:.5}
  .pager{height:4rem;display:flex;justify-content:center;align-items:center;gap:1rem;color:var(--muted);font-size:1.8rem;flex:none}
  .dot{width:1.2rem;height:1.2rem;border-radius:50%;background:var(--line)}.dot.on{background:var(--brand-soft)}
  .next .dot.on{background:var(--slate)}

  footer{height:5rem;display:flex;justify-content:space-between;align-items:center;padding:0 5rem;color:var(--muted);font-size:1.9rem;border-top:1px solid var(--line);background:var(--footer)}
  .status{display:flex;align-items:center;gap:1rem}
  .led{width:1.2rem;height:1.2rem;border-radius:50%;background:var(--green);box-shadow:0 0 1rem var(--green)}
  .led.off{background:var(--brand-soft);box-shadow:0 0 1rem var(--brand-soft)}
  .demo{color:var(--amber);font-weight:700;letter-spacing:.2rem}
  .right{display:flex;align-items:center;gap:2.4rem}
  .tema{font:inherit;font-size:1.7rem;color:var(--muted);background:var(--chip);border:.15rem solid var(--line);border-radius:5rem;padding:.35rem 1.6rem;cursor:pointer;white-space:nowrap}
  .tema:hover{color:var(--text)}
  .tema:focus-visible{outline:.3rem solid var(--brand-soft);outline-offset:.2rem}
  body,.panel,.row,.card,.bar,footer,.chip{transition:background-color .35s,color .35s,border-color .35s}

  /* ===== TAMPILAN DAFTAR (HP, tablet, komputer): bisa digulir, tanpa ganti halaman otomatis ===== */
  html[data-layout="list"]{font-size:clamp(8px,.9vw + 4.5px,11px)}
  html[data-layout="list"] body{width:auto;height:auto;min-height:100vh;overflow:auto;display:block}
  html[data-layout="list"] header{height:auto;padding:1.6rem 2rem;flex-wrap:wrap;gap:1.2rem}
  html[data-layout="list"] .title h1{font-size:2.8rem;letter-spacing:.15rem}
  html[data-layout="list"] .title p{font-size:1.3rem;letter-spacing:.15rem;margin-top:.6rem}
  html[data-layout="list"] .logo{height:5.6rem}
  html[data-layout="list"] .stripe{height:.6rem}
  html[data-layout="list"] .bar{height:auto;padding:1.2rem 2rem;gap:1rem;flex-wrap:wrap}
  html[data-layout="list"] .date{font-size:1.9rem}
  html[data-layout="list"] .clock{font-size:2.8rem}
  html[data-layout="list"] .clock small{font-size:1.5rem}
  html[data-layout="list"] main{display:grid;grid-template-columns:minmax(0,1fr);gap:1.6rem;padding:1.6rem;min-height:0;align-items:start}
  html[data-layout="list"] .panel{border-radius:1.2rem;overflow:visible}
  html[data-layout="list"] .ph,html[data-layout="list"] .next .ph{height:auto;min-height:0;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:1.4rem 1.6rem;gap:.8rem}
  html[data-layout="list"] .ph h2,html[data-layout="list"] .next .ph h2{font-size:2.2rem;letter-spacing:.15rem;gap:1rem}
  html[data-layout="list"] .ph h2::before,html[data-layout="list"] .next .ph h2::before{width:.6rem;height:2.4rem}
  html[data-layout="list"] .chips{gap:.6rem;flex-wrap:wrap}
  html[data-layout="list"] .chip,html[data-layout="list"] .next .chip{font-size:1.4rem;padding:.3rem 1rem}
  html[data-layout="list"] .chip b,html[data-layout="list"] .next .chip b{font-size:1.7rem}
  html[data-layout="list"] .list{flex:none;padding:1.2rem;gap:1rem;overflow:visible}
  html[data-layout="list"] .row{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"jam nm badge" "inst inst inst" "tuj tuj qty" "kep kep kep";
      gap:1rem 1.2rem;padding:1.2rem;min-height:0;border-left-width:.5rem;align-items:start}
  html[data-layout="list"] .jam{grid-area:jam;padding-right:1.1rem;border-right-width:.15rem}
  html[data-layout="list"] .jam .lb{font-size:1rem}
  html[data-layout="list"] .jam .v{font-size:2.6rem}
  html[data-layout="list"] .fld.nm{grid-area:nm}
  html[data-layout="list"] .fld.inst{grid-area:inst}
  html[data-layout="list"] .fld.tuj{grid-area:tuj}
  html[data-layout="list"] .fld.kep{grid-area:kep}
  html[data-layout="list"] .fld .lb{font-size:1rem}
  html[data-layout="list"] .fld .val,html[data-layout="list"] .fld.wide .val{font-size:1.7rem}
  html[data-layout="list"] .fld.nm .val{font-size:2rem}
  html[data-layout="list"] .fld.inst .val{font-size:1.8rem}
  html[data-layout="list"] .qty{grid-area:qty;font-size:2.2rem;text-align:right;align-self:start}
  html[data-layout="list"] .qty small{font-size:1rem}
  html[data-layout="list"] .badge{grid-area:badge;align-self:start;font-size:1.3rem;padding:.35rem .9rem}
  html[data-layout="list"] .card{min-height:0;padding:1.1rem 1.3rem;border-left-width:.5rem;gap:.3rem}
  html[data-layout="list"] .card .dt{font-size:1.7rem;white-space:normal}
  html[data-layout="list"] .card .badge{font-size:1.2rem}
  html[data-layout="list"] .card .nm2{font-size:1.9rem}
  html[data-layout="list"] .card .in2{font-size:1.7rem}
  html[data-layout="list"] .card .l4,html[data-layout="list"] .card .l5{font-size:1.5rem}
  html[data-layout="list"] .empty,html[data-layout="list"] .next .empty{font-size:1.7rem;padding:3rem 1rem;flex:none}
  html[data-layout="list"] .empty i{font-size:4rem}
  html[data-layout="list"] .pager{display:none}
  html[data-layout="list"] footer{height:auto;padding:1.2rem 1.6rem;flex-wrap:wrap;gap:1rem;font-size:1.3rem}
  html[data-layout="list"] .right{flex-wrap:wrap;gap:.8rem}
  html[data-layout="list"] .tema{font-size:1.3rem;padding:.6rem 1.3rem}
  @media (min-width:900px){
    html[data-layout="list"] main{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
  }
  /* HP (di bawah 900 px) tidak punya tampilan TV: tombol pengganti disembunyikan */
  @media (max-width:899px){ #btnLayout{display:none} }
  /* Tombol kembali yang selalu terbaca bila tampilan TV dibuka di layar kecil (tablet) */
  #fabLayout{display:none;position:fixed;right:14px;bottom:14px;z-index:99;font:600 15px/1 Arial,sans-serif;padding:13px 18px;border-radius:26px;background:var(--brand);color:#fff;border:0;box-shadow:0 2px 10px rgba(0,0,0,.35);cursor:pointer}
  @media (max-width:1199px){ html[data-layout="tv"] #fabLayout{display:block} }
</style>
</head>

<script>
/* ================= PENGATURAN ================= */
const CONFIG = {
  // URL CSV dari: Sheet > File > Bagikan > Publikasikan ke web > tab "Data" > format CSV
  // Kosongkan untuk mode DEMO (data contoh).
  CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSUjagrYX6Md5NS1iAggmydT4SCXERHtVYGmeatZzLY_E0HwcZg-4167RgJRd_M8EZlQzZIKdrk_G0L/pub?gid=1&single=true&output=csv",
  REFRESH_SEC: 60,   // ambil ulang data
  PAGE_SEC: 12,      // ganti halaman jika daftar panjang (jumlah baris per halaman dihitung otomatis)
  HARI_KE_DEPAN: 7,        // jangkauan panel kanan (1-60). Bisa diubah per pengguna lewat alamat: ?hari=14
  TAMPILAN: "auto",        // "auto" (TV untuk layar lebar, daftar untuk HP/tablet), "tv", atau "daftar"
  TEMA_DEFAULT: "light",   // "light" (terang) atau "dark" (gelap)
  AUTO_TEMA: {             // opsional: otomatis gelap pada jam tertentu (hanya jika tema belum dipilih manual)
    aktif: false,
    gelapMulai: "18:00",
    gelapSelesai: "06:00"
  }
};

/* ================= UTIL ================= */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const dayStart = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);

function parseCSV(text){
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ","){ row.push(cur); cur = ""; }
    else if (c === "\n"){ row.push(cur); rows.push(row); row = []; cur = ""; }
    else if (c !== "\r") cur += c;
  }
  if (cur !== "" || row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function parseDMY(s){            // "18/11/2026" atau "2026-11-18"
  s = (s || "").trim();
  let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  if (m) return new Date(+m[3], +m[2]-1, +m[1]);
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? new Date(+m[1], +m[2]-1, +m[3]) : null;
}
function toGuests(rows){
  const h = rows[0].map(x => x.trim());
  const get = (r, n) => { const i = h.indexOf(n); return i < 0 ? "" : (r[i] || "").trim(); };
  return rows.slice(1).map(r => ({
    nama: get(r, "Nama"), instansi: get(r, "Instansi"), mulai: parseDMY(get(r, "Tanggal Mulai")),
    pic: get(r, "PIC Tujuan"), keperluan: get(r, "Keperluan"), jam: get(r, "Jam"), durasi: get(r, "Durasi"),
    jumlah: parseInt(get(r, "Jumlah"), 10) || 1, selesai: parseDMY(get(r, "Tanggal Selesai"))
  })).filter(g => g.nama && g.mulai && g.selesai);
}

/* ================= RENDER ================= */
const state = { guests: [], page: {today: 0, next: 0} };
const DAYS = Math.min(60, Math.max(1, parseInt(new URLSearchParams(location.search).get("hari"), 10) || CONFIG.HARI_KE_DEPAN));
$("hNext").textContent = DAYS + " HARI KE DEPAN";

function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
const isTemp = g => /^temporary/i.test(g.durasi || "");
function badge(g){ return el("div", "badge " + (isTemp(g) ? "t" : "i"), isTemp(g) ? "Temporary" : "Ijin Kerja"); }
function fld(label, val, cls){ const d = el("div", "fld" + (cls ? " " + cls : "")); d.append(el("span", "lb", label), el("div", "val", val || "-")); return d; }
const HARI = ["Min","Sen","Sel","Rab","Kam","Jum","Sab"];
const dm = d => pad(d.getDate()) + "/" + pad(d.getMonth() + 1);
const jamOK = g => g.jam && g.jam !== "-" ? g.jam : "";

function makeRow(g){                       // panel HARI INI
  const row = el("div", "row");
  const jam = el("div", "jam"); jam.append(el("span", "lb", "Pukul"), el("div", "v", g.jam || "-"));
  const qty = el("div", "qty", String(g.jumlah)); qty.append(el("small", null, "Orang"));
  row.append(jam, fld("Nama", g.nama, "nm"), fld("Instansi", g.instansi, "inst"), fld("Tujuan", g.pic, "wide tuj"), fld("Keperluan", g.keperluan, "wide kep"), qty, badge(g));
  return row;
}
function makeCard(g){                      // panel 7 HARI KE DEPAN (ringkas)
  const c = el("div", "card");
  const dt = el("div", "dt");
  const rentang = g.selesai > g.mulai ? " \u2192 " + dm(g.selesai) : "";
  dt.append(el("span", "j", jamOK(g) || "--:--"), el("span", "d", HARI[g.mulai.getDay()] + " " + dm(g.mulai) + rentang));
  const l1 = el("div", "l1"); l1.append(dt, badge(g));
  const l4 = el("div", "l4"); l4.append(el("i", null, "Tujuan"), document.createTextNode((g.pic || "-") + "  \u00b7  " + g.jumlah + " orang"));
  const l5 = el("div", "l5"); l5.append(el("i", null, "Perlu"), document.createTextNode(g.keperluan || "-"));
  c.append(l1, el("div", "nm2", g.nama), el("div", "in2", g.instansi || "-"), l4, l5);
  return c;
}
/* Bagi daftar menjadi halaman berdasarkan TINGGI NYATA tiap baris/kartu (teks panjang tidak pernah dipotong). */
function paginate(listEl, items, make){
  if (document.documentElement.dataset.layout === "list") return {pages: [items.map(g => ({g, h: 0}))], avail: Infinity};   // daftar: semua tampil, halaman digulir
  const rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
  const gap = 1.2 * rem, avail = listEl.clientHeight - 3.2 * rem;
  const probe = document.createElement("div");
  probe.className = "list";
  probe.style.cssText = `position:absolute;visibility:hidden;left:-99999px;top:0;width:${listEl.clientWidth}px;height:auto;flex:none`;
  const nodes = items.map(make);
  probe.append(...nodes); document.body.append(probe);
  const hs = nodes.map(n => n.offsetHeight);
  probe.remove();
  const pages = []; let cur = [], used = 0;
  items.forEach((g, i) => {
    const need = hs[i] + (cur.length ? gap : 0);
    if (cur.length && used + need > avail){ pages.push(cur); cur = []; used = 0; }
    cur.push({g, h: hs[i]}); used += hs[i] + (cur.length > 1 ? gap : 0);
  });
  if (cur.length) pages.push(cur);
  return {pages, avail};
}
function renderPanel(key, list){
  const k = key === "Today" ? "today" : "next";
  const make = k === "today" ? makeRow : makeCard;
  const listEl = $("list" + key), chip = $("chip" + key), pager = $("pager" + key);
  const total = list.reduce((a, g) => a + g.jumlah, 0);
  chip.innerHTML = `<span class="chip"><b>${list.length}</b>kunjungan</span><span class="chip"><b>${total}</b>orang</span>`;
  listEl.replaceChildren(); pager.replaceChildren();
  if (!list.length){
    listEl.innerHTML = `<div class="empty"><i>&#9786;</i>${k === "today" ? "Tidak ada kunjungan hari ini" : "Tidak ada rencana kunjungan dalam ${DAYS} hari ke depan"}</div>`;
    return;
  }
  const {pages, avail} = paginate(listEl, list, make);
  state.page[k] = state.page[k] % pages.length;
  pages[state.page[k]].forEach(({g, h}) => {
    const n = make(g);
    if (h > avail) n.style.zoom = Math.max(.5, avail / h * .98);   // jaga-jaga: satu entri sangat panjang diperkecil, bukan dipotong
    listEl.append(n);
  });
  if (pages.length > 1){
    for (let i = 0; i < pages.length; i++) pager.append(el("span", "dot" + (i === state.page[k] ? " on" : "")));
    pager.append(el("span", null, `  halaman ${state.page[k] + 1}/${pages.length}`));
  }
}
function render(){
  const t = dayStart(new Date()), batas = addDays(t, DAYS);
  const jamKey = g => jamOK(g) || "99:99";
  const today = state.guests.filter(g => g.mulai <= t && g.selesai >= t)
    .sort((a, b) => jamKey(a).localeCompare(jamKey(b)) || a.nama.localeCompare(b.nama));
  // N hari ke depan = kunjungan yang MULAI besok s/d N hari lagi (yang sudah berlangsung hari ini ada di panel HARI INI)
  const next = state.guests.filter(g => g.mulai > t && g.mulai <= batas)
    .sort((a, b) => (a.mulai - b.mulai) || jamKey(a).localeCompare(jamKey(b)) || a.nama.localeCompare(b.nama));
  renderPanel("Today", today); renderPanel("Next", next);
}
function tick(){
  const now = new Date();
  $("date").textContent = now.toLocaleDateString("id-ID", {weekday:"long", day:"numeric", month:"long", year:"numeric"});
  $("clock").innerHTML = `${pad(now.getHours())}:${pad(now.getMinutes())}<small>${pad(now.getSeconds())}</small>`;
}

/* ================= DATA ================= */
async function load(){
  try{
    if (!CONFIG.CSV_URL){ state.guests = demoData(); $("demo").innerHTML = '<span class="demo">MODE DEMO &middot; DATA CONTOH</span>'; }
    else{
      const res = await fetch(CONFIG.CSV_URL + (CONFIG.CSV_URL.includes("?") ? "&" : "?") + "t=" + Date.now(), {cache: "no-store"});
      if (!res.ok) throw new Error(res.status);
      state.guests = toGuests(parseCSV(await res.text()));
    }
    $("led").className = "led";
    $("status").textContent = "Diperbarui " + pad(new Date().getHours()) + ":" + pad(new Date().getMinutes()) + " · sinkron otomatis tiap " + CONFIG.REFRESH_SEC + " detik";
  }catch(e){
    $("led").className = "led off";
    $("status").textContent = "Gagal memuat data terbaru – menampilkan data terakhir";
  }
  render();
}
/* ================= TEMA TERANG / GELAP ================= */
/* Ganti tema: klik tombol di pojok kanan bawah, atau tekan tombol T. Pilihan diingat di perangkat.
   Alamat khusus: ?tema=dark  |  ?tema=light  |  ?tema=auto (hapus pilihan tersimpan). */
const TEMA_KEY = "tema-monitor";
const store = {
  get(){ try { return localStorage.getItem(TEMA_KEY); } catch(e){ return null; } },
  set(v){ try { localStorage.setItem(TEMA_KEY, v); } catch(e){} },
  del(){ try { localStorage.removeItem(TEMA_KEY); } catch(e){} }
};
function malamSekarang(){
  const a = CONFIG.AUTO_TEMA, m = s => { const [h, mi] = s.split(":").map(Number); return h * 60 + mi; };
  const now = new Date(), n = now.getHours() * 60 + now.getMinutes(), mulai = m(a.gelapMulai), selesai = m(a.gelapSelesai);
  return mulai > selesai ? (n >= mulai || n < selesai) : (n >= mulai && n < selesai);
}
function pilihTema(){
  const q = new URLSearchParams(location.search).get("tema");
  if (q === "dark" || q === "light"){ store.set(q); return q; }
  if (q === "auto") store.del();
  const saved = store.get();
  if (saved === "dark" || saved === "light") return saved;
  if (CONFIG.AUTO_TEMA && CONFIG.AUTO_TEMA.aktif) return malamSekarang() ? "dark" : "light";
  return CONFIG.TEMA_DEFAULT === "dark" ? "dark" : "light";
}
function terapkanTema(t){
  document.documentElement.dataset.tema = t;
  $("btnTema").textContent = t === "dark" ? "\u2600  Mode terang" : "\u263E  Mode gelap";
}
function gantiTema(){
  const t = document.documentElement.dataset.tema === "dark" ? "light" : "dark";
  store.set(t); terapkanTema(t);
}
terapkanTema(pilihTema());
$("btnTema").addEventListener("click", gantiTema);
document.addEventListener("keydown", e => { if ((e.key === "t" || e.key === "T") && !e.ctrlKey && !e.metaKey && !e.altKey) gantiTema(); });
setInterval(() => { if (CONFIG.AUTO_TEMA && CONFIG.AUTO_TEMA.aktif && !store.get()) terapkanTema(malamSekarang() ? "dark" : "light"); }, 60000);

/* ================= TAMPILAN TV / DAFTAR ================= */
/* TV dan layar lebar memakai tampilan TV (muat satu layar, ganti halaman otomatis).
   HP dan tablet memakai tampilan daftar (bisa digulir). Ganti manual: tombol di pojok kanan bawah.
   Alamat khusus: ?tampilan=tv  |  ?tampilan=daftar  |  ?tampilan=auto (hapus pilihan tersimpan). */
const LAYOUT_KEY = "tampilan-monitor";
const storeL = {
  get(){ try { return localStorage.getItem(LAYOUT_KEY); } catch(e){ return null; } },
  set(v){ try { localStorage.setItem(LAYOUT_KEY, v); } catch(e){} },
  del(){ try { localStorage.removeItem(LAYOUT_KEY); } catch(e){} }
};
const TV_MIN = 900;   // di bawah lebar ini (HP) tampilan TV tidak dipakai: teksnya terlalu kecil untuk dibaca
const autoLayout = () => (window.innerWidth >= 1200 && window.innerWidth / window.innerHeight >= 1.4) ? "tv" : "list";
const batasi = l => (l === "tv" && window.innerWidth < TV_MIN) ? "list" : l;
function layoutDipilih(){                       // tanpa efek samping
  const saved = storeL.get();
  if (saved === "tv" || saved === "daftar") return saved === "tv" ? "tv" : "list";
  if (CONFIG.TAMPILAN === "tv" || CONFIG.TAMPILAN === "daftar") return CONFIG.TAMPILAN === "tv" ? "tv" : "list";
  return autoLayout();
}
function pilihLayout(){
  const q = new URLSearchParams(location.search).get("tampilan");
  if (q === "tv" || q === "daftar") storeL.set(q);
  else if (q === "auto") storeL.del();
  return batasi(layoutDipilih());
}
function terapkanLayout(l){
  document.documentElement.dataset.layout = l;
  $("btnLayout").textContent = l === "tv" ? "\u2630  Tampilan daftar" : "\u25A3  Tampilan TV";
}
function gantiLayout(){
  const l = document.documentElement.dataset.layout === "tv" ? "list" : "tv";
  storeL.set(l === "tv" ? "tv" : "daftar"); terapkanLayout(batasi(l)); render(); window.scrollTo(0, 0);
}
terapkanLayout(pilihLayout());
$("btnLayout").addEventListener("click", gantiLayout);
$("fabLayout").addEventListener("click", gantiLayout);

tick(); setInterval(tick, 1000);
load(); setInterval(load, CONFIG.REFRESH_SEC * 1000);
setInterval(() => { state.page.today++; state.page.next++; render(); }, CONFIG.PAGE_SEC * 1000);
window.addEventListener("resize", () => {
  terapkanLayout(batasi(layoutDipilih()));   // putar tablet atau ubah ukuran jendela: ikut menyesuaikan
  render();
});
</script>
